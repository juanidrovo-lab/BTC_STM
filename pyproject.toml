[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-stm"
version = "0.1.0"
description = "BTC STM base package"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "BTC_STM Team"}]

dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
