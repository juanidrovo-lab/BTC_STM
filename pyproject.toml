[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-stm"
version = "0.2.0"
description = "BTC STM base package"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "BTC_STM Team" }]

dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "fastapi>=0.110,<1",
  "mangum>=0.17,<1",
  "anyio>=4.0,<5",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "websockets>=12.0,<14",
]

[project.scripts]
btc-stm = "btc_stm.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]
db = [
  "asyncpg>=0.29,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
]
api = [
  "btc-stm[db]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.vercel]
entrypoint = "api/index.py"

